plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
    id 'com.google.devtools.ksp'
}

android {
    namespace 'com.ziaee.frenchreader'
    compileSdk 34
    defaultConfig {
        applicationId "com.ziaee.frenchreader"
        minSdk 26
        targetSdk 34
        versionCode 9
        versionName "0.8.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Chaquopy needs at least one ABI. arm64-v8a covers virtually all
        // real phones from the last ~8 years; x86_64 is added only so a
        // Mac/PC emulator could also run it if needed later.
        ndk {
            abiFilters.addAll(["arm64-v8a", "x86_64"])
        }

        // --- Chaquopy / Python config -----------------------------------
        // THIS BLOCK IS THE CORE OF THE SPIKE.
        // edge-tts pulls in aiohttp, which itself needs multidict / yarl /
        // frozenlist / propcache (C-extension packages). Chaquopy can only
        // install packages it (or its curated mirror) has pre-built wheels
        // for on Android's ABIs. If any of these fail to resolve during
        // Gradle sync, that's the exact signal the design doc's "first
        // technical test" is meant to catch -- see SPIKE_README.md for the
        // fallback plan (pin older versions / vendor a trimmed edge-tts).
        //
        // NOTE: this MUST be plain Groovy (this file), not Kotlin DSL --
        // Chaquopy's `python {}` extension on defaultConfig doesn't resolve
        // in build.gradle.kts without extra accessor plumbing, which is
        // exactly the "Unresolved reference: python" error we hit.
        python {
            pip {
                install "edge-tts"
            }
        }

    }

    // Release signing reads a properties file kept outside the repo (default
    // ~/.android/frenchreader-release.properties, overridable with the
    // frenchreaderSigningProps Gradle property). Without it, release builds
    // are produced unsigned so anyone can still build from source.
    def signingPropsFile = file(project.findProperty("frenchreaderSigningProps") ?:
        "${System.getProperty('user.home')}/.android/frenchreader-release.properties")
    if (signingPropsFile.exists()) {
        def signingProps = new Properties()
        signingPropsFile.withInputStream { signingProps.load(it) }
        signingConfigs {
            release {
                storeFile file(signingProps["storeFile"])
                storePassword signingProps["storePassword"]
                keyAlias signingProps["keyAlias"]
                keyPassword signingProps["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            if (signingPropsFile.exists()) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion "1.5.14"
    }

    packaging {
        resources {
            excludes += ["/META-INF/AL2.0", "/META-INF/LGPL2.1"]
        }
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.06.00')
    implementation "androidx.credentials:credentials:1.3.0"
    implementation "androidx.credentials:credentials-play-services-auth:1.3.0"
    implementation "com.google.android.libraries.identity.googleid:googleid:1.1.1"
    implementation "com.google.android.gms:play-services-auth:21.2.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.8.1"
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition:19.0.1'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.material3:material3'
    // NOTE: Replay10 / Forward10 / SkipNext / SkipPrevious / Pause etc. are
    // NOT in material-icons-core (only ~20 common icons are) -- they need
    // the full "extended" icon pack. This was the "Unresolved reference"
    // build failure.
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.1'

    // Media3 for MP3 playback (used by the full app for background
    // playback + notification controls too, per the design doc).
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation 'androidx.media3:media3-session:1.3.1'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // Navigation between Texts list / Reading screen.
    implementation 'androidx.navigation:navigation-compose:2.7.7'

    // Local storage for texts, reading positions, and saved vocabulary.
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    ksp 'androidx.room:room-compiler:2.6.1'
    implementation 'org.jsoup:jsoup:1.17.2'
    // Offline French speech recognition for shadowing mode (model downloaded at runtime).
    implementation 'com.alphacephei:vosk-android:0.3.47'
    implementation 'net.java.dev.jna:jna:5.13.0@aar'

    // Article and headline images: Home news cards and Library rows.
    implementation 'io.coil-kt:coil-compose:2.7.0'

    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'xmlpull:xmlpull:1.1.3.1'
    testImplementation 'net.sf.kxml:kxml2:2.3.0'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1'

    androidTestImplementation platform('androidx.compose:compose-bom:2024.06.00')
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.1'
    androidTestImplementation 'androidx.room:room-testing:2.6.1'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
}
